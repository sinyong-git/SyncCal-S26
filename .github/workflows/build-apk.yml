name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project
        run: |
          flutter create --org com.synccal --project-name synccal_ai app_project
          cd app_project
          
          # 패키지 의존성 추가
          flutter pub add intl
          
          # 캘린더 및 알림 권한 추가
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Write App Code
        run: |
          python3 -c "
          code = '''import 'package:flutter/material.dart';

          void main() {
            runApp(const SyncCalApp());
          }

          class SyncCalApp extends StatelessWidget {
            const SyncCalApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'SyncCal AI',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFF2563EB),
                  scaffoldBackgroundColor: const Color(0xFFF8FAFC),
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF2563EB)),
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _controller = TextEditingController();
            bool _isAnalyzing = false;
            Map<String, dynamic>? _extractedEvent;

            void _analyzeMessage() {
              if (_controller.text.trim().isEmpty) return;
              setState(() {
                _isAnalyzing = true;
              });

              Future.delayed(const Duration(milliseconds: 1000), () {
                setState(() {
                  _isAnalyzing = false;
                  _extractedEvent = {
                    'title': '중요 일정 약속',
                    'date': '2026-10-15 14:00',
                    'location': '미팅 장소 (텍스트 기반 자동 추출)',
                    'reminders': '1일 전, 1시간 전',
                    'memo': _controller.text,
                  };
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  elevation: 0,
                  backgroundColor: Colors.white,
                  title: const Text(
                    'SyncCal AI',
                    style: TextStyle(color: Color(0xFF0F172A), fontWeight: FontWeight.bold),
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        '메시지 일정 자동 추출기',
                        style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF0F172A)),
                      ),
                      const SizedBox(height: 8),
                      const Text(
                        '카톡이나 문자로 수신된 내용을 아래에 입력하시면 일정을 분석해 캘린더에 연동합니다.',
                        style: TextStyle(fontSize: 14, color: Color(0xFF64748B)),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: _controller,
                        maxLines: 4,
                        decoration: InputDecoration(
                          hintText: '예: 다음 주 화요일 오후 2시에 미팅 진행하겠습니다.',
                          fillColor: Colors.white,
                          filled: true,
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 14),
                      SizedBox(
                        width: double.infinity,
                        height: 48,
                        child: ElevatedButton(
                          onPressed: _isAnalyzing ? null : _analyzeMessage,
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFF2563EB),
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                          ),
                          child: _isAnalyzing
                              ? const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(color: Colors.white, strokeWidth: 2))
                              : const Text('일정 분석 및 카드 생성', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      if (_extractedEvent != null) ...[
                        const SizedBox(height: 24),
                        Container(
                          padding: const EdgeInsets.all(18),
                          decoration: BoxDecoration(
                            color: Colors.white,
                            borderRadius: BorderRadius.circular(16),
                            border: Border.all(color: const Color(0xFFE2E8F0)),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                _extractedEvent!['title']!,
                                style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF0F172A)),
                              ),
                              const SizedBox(height: 10),
                              Text('일시: ' + _extractedEvent!['date']!),
                              const SizedBox(height: 4),
                              Text('장소: ' + _extractedEvent!['location']!),
                              const SizedBox(height: 4),
                              Text('알림: ' + _extractedEvent!['reminders']!),
                              const SizedBox(height: 16),
                              SizedBox(
                                width: double.infinity,
                                child: ElevatedButton(
                                  onPressed: () {
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(content: Text('캘린더에 성공적으로 등록되었습니다.')),
                                    );
                                  },
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: const Color(0xFF0F172A),
                                  ),
                                  child: const Text('스마트폰 캘린더에 저장', style: TextStyle(color: Colors.white)),
                                ),
                              )
                            ],
                          ),
                        )
                      ]
                    ],
                  ),
                ),
              );
            }
          }
          '''
          with open('app_project/lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(code)
          "

      - name: Build Galaxy S26 APK
        run: |
          cd app_project
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncCal_AI_Galaxy_S26
          path: app_project/build/app/outputs/flutter-apk/app-debug.apk
